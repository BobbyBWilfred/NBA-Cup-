<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NBA Cup Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF0F4;--card:#fff;--ink:#0F1B2D;--mute:#5B687B;--line:#D3D9E2;--acc:#1F4FD8;--led:#0F1B2D;--ledt:#FFB547;--win:#0E7A4B;--bad:#B3261E;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1220;--card:#121C2E;--ink:#E7ECF4;--mute:#93A0B5;--line:#24324A;--acc:#6C95FF;--led:#050A14;--win:#3DD598;--bad:#FF8A80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1220;--card:#121C2E;--ink:#E7ECF4;--mute:#93A0B5;--line:#24324A;--acc:#6C95FF;--led:#050A14;--win:#3DD598;--bad:#FF8A80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1,h2,h3,.sc{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif}
h1{font-size:48px;line-height:1;margin:0;font-weight:700}
h2{font-size:30px;margin:22px 0 8px;font-weight:700}
h3{font-size:24px;margin:0 0 10px;font-weight:700}
.top,.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.top{justify-content:space-between}
.note{color:var(--mute);font-size:14px;font-weight:400}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px}
button.p{background:var(--acc);color:#fff;border-color:transparent}
button.d{color:var(--bad)}
button.arm{background:var(--bad);color:#fff;border-color:transparent}
input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tabs{display:flex;gap:4px;margin:16px 0;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-radius:8px 8px 0 0;background:none;padding:10px 16px;font-weight:600;color:var(--mute)}
.tabs button[aria-selected=true]{color:var(--ink);box-shadow:inset 0 -3px var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.empty{text-align:center;padding:32px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;color:var(--mute);text-align:right}
th:first-child,td:first-child{text-align:left}
td{padding:4px 0;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
tr.q td:first-child{box-shadow:inset 3px 0 var(--win);padding-left:6px}
.tm img{width:22px;height:22px;object-fit:contain;vertical-align:middle;margin-right:6px}
.tm i{display:none;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px}
.tm small{color:var(--mute)}
.g{display:grid;grid-template-columns:1fr auto auto auto 1fr;gap:6px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
.g span:first-child{text-align:right}
.sc{width:54px;font-size:24px;font-weight:700;text-align:center;background:var(--led);color:var(--ledt);border:1px solid var(--line);border-radius:6px;padding:2px 0;-moz-appearance:textfield}
.sc::-webkit-inner-spin-button,.sc::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.sc.bad{border-color:var(--bad)}
.sc:disabled{opacity:.75}
.scroll{overflow-x:auto}
.br{display:flex;gap:28px;align-items:center;min-width:max-content}
.col{display:flex;flex-direction:column;gap:14px}
.m{width:250px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:6px 0}
.m .note{padding:0 10px 4px}
.r{display:flex;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid var(--line)}
.r.w{color:var(--win);font-weight:700}
.seed{width:14px;color:var(--mute);font-size:12px;font-weight:400}
details{margin:8px 0}
summary{cursor:pointer;font-weight:600}
textarea{width:100%;min-height:90px;box-sizing:border-box}
</style></head>
<body><div id="app"></div>
<script>
const KEY='nbaCupTracker.v1';
const T={ATL:["Hawks","#C8102E"],BOS:["Celtics","#007A33"],BKN:["Nets","#6B7280"],CHA:["Hornets","#00788C"],CHI:["Bulls","#CE1141"],CLE:["Cavaliers","#860038"],DET:["Pistons","#1D42BA"],IND:["Pacers","#FDBB30"],MIA:["Heat","#98002E"],MIL:["Bucks","#00471B"],NYK:["Knicks","#F58426"],ORL:["Magic","#0077C0"],PHI:["76ers","#006BB6"],TOR:["Raptors","#CE1141"],WAS:["Wizards","#E31837"],DAL:["Mavericks","#00538C"],DEN:["Nuggets","#FEC524"],GSW:["Warriors","#FFC72C"],HOU:["Rockets","#CE1141"],LAC:["Clippers","#C8102E"],LAL:["Lakers","#552583"],MEM:["Grizzlies","#5D76A9"],MIN:["Timberwolves","#236192"],NOP:["Pelicans","#C8102E"],OKC:["Thunder","#007AC1"],PHX:["Suns","#E56020"],POR:["Trail Blazers","#E03A3E"],SAC:["Kings","#5A2D81"],SAS:["Spurs","#8A8D8F"],UTA:["Jazz","#F9A01B"]};
const EA=['ATL','BOS','BKN','CHA','CHI','CLE','DET','IND','MIA','MIL','NYK','ORL','PHI','TOR','WAS'],WE=Object.keys(T).filter(t=>!EA.includes(t));
const GN=['East A','East B','East C','West A','West B','West C'];
const ID={ATL:1610612737,BOS:1610612738,BKN:1610612751,CHA:1610612766,CHI:1610612741,CLE:1610612739,DET:1610612765,IND:1610612754,MIA:1610612748,MIL:1610612749,NYK:1610612752,ORL:1610612753,PHI:1610612755,TOR:1610612761,WAS:1610612764,DAL:1610612742,DEN:1610612743,GSW:1610612744,HOU:1610612745,LAC:1610612746,LAL:1610612747,MEM:1610612763,MIN:1610612750,NOP:1610612740,OKC:1610612760,PHX:1610612756,POR:1610612757,SAC:1610612758,SAS:1610612759,UTA:1610612762};
const fresh=()=>({season:'2026-27',groups:null,games:{},ko:{},history:[]});
let ok=true,S=Object.assign(fresh(),(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(x){return{}}})());
let tab='groups',armed=null,tmr,msg='',imsg='';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));ok=true}catch(x){ok=false}};
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nextSeason=s=>{let m=/^(\d{4})-(\d{2})$/.exec(s);if(m){const y=+m[1]+1;return y+'-'+String((y+1)%100).padStart(2,'0')}m=/^\d{4}$/.exec(s);return m?String(+s+1):s+' (next)'};
const num=v=>v===''||v==null||isNaN(v)?null:+v;
const tm=t=>`<span class="tm" style="--c:${T[t][1]}"><img src="https://cdn.nba.com/logos/nba/${ID[t]}/primary/L/logo.svg" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-block'"><i></i><b>${t}</b> <small>${T[t][0]}</small></span>`;
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ch=a=>[a.slice(0,5),a.slice(5,10),a.slice(10)];
const pairs=g=>{const p=[];for(let i=0;i<5;i++){p.push([g[i],g[(i+1)%5]]);p.push([g[i],g[(i+2)%5]])}return p};
const cmp=(a,b)=>b.w-a.w||(b.pf-b.pa)-(a.pf-a.pa)||b.pf-a.pf||(a.t<b.t?-1:1);
function stand(st,gi){const g=st.groups[gi],r={};let n=0;g.forEach(t=>r[t]={t,w:0,l:0,pf:0,pa:0});
 pairs(g).forEach(([h,a])=>{const s=st.games[h+'>'+a];if(!s)return;const x=num(s[0]),y=num(s[1]);if(x===null||y===null||x===y)return;n++;r[h].pf+=x;r[h].pa+=y;r[a].pf+=y;r[a].pa+=x;r[x>y?h:a].w++;r[x>y?a:h].l++});
 return{rows:Object.values(r).sort(cmp),n}}
function seeds(st,c){if(!st.groups)return null;const R=(c==='E'?[0,1,2]:[3,4,5]).map(i=>stand(st,i));if(R.some(x=>x.n<10))return null;
 const w=R.map(x=>x.rows[0]).sort(cmp),s=R.map(x=>x.rows[1]).sort(cmp)[0];return[...w,s].map(x=>x.t)}
function mk(st,id,t,h,a){const o={id,t,h,a,hs:'',as:'',win:null},s=st.ko[id];
 if(h&&a&&s&&s.h===h&&s.a===a){o.hs=s.hs;o.as=s.as;const x=num(s.hs),y=num(s.as);if(x!==null&&y!==null&&x!==y)o.win=x>y?h:a}return o}
function bracket(st){const m={},s={E:seeds(st,'E'),W:seeds(st,'W')};
 for(const c of'EW'){const q=s[c];m[c+'Q1']=mk(st,c+'Q1','Quarterfinal',q&&q[0],q&&q[3]);m[c+'Q2']=mk(st,c+'Q2','Quarterfinal',q&&q[1],q&&q[2]);
  let a=m[c+'Q1'].win,b=m[c+'Q2'].win;if(a&&b&&q.indexOf(b)<q.indexOf(a))[a,b]=[b,a];m[c+'S']=mk(st,c+'S','Semifinal',a,b)}
 m.F=mk(st,'F','Final',m.ES.win,m.WS.win);return{m,s}}
const btn=(a,l,c)=>`<button data-act="${a}" class="${c||''}${armed===a?' arm':''}">${armed===a?'Tap again to confirm':l}</button>`;
function groupsHTML(st,ro){return'<div class="grid">'+st.groups.map((g,gi)=>{const{rows,n}=stand(st,gi);
 return`<div class="card"><h3>${GN[gi]} <span class="note">${n} of 10 games</span></h3><table><tr><th>Team</th><th>W–L</th><th>Diff</th></tr>${rows.map((r,i)=>{const d=r.pf-r.pa;return`<tr class="${n==10&&i==0?'q':''}"><td>${tm(r.t)}</td><td>${r.w}–${r.l}</td><td>${d>0?'+':''}${d}</td></tr>`}).join('')}</table><div style="margin-top:10px">${pairs(g).map(([h,a])=>{const k=h+'>'+a,s=st.games[k]||[],x=num(s[0]),y=num(s[1]),b=x!==null&&x===y?' bad':'';
  return`<div class="g"><span>${h}</span><input class="sc${b}" type="number" min="0" inputmode="numeric" data-k="${k}" value="${s[0]??''}" ${ro?'disabled':''} aria-label="${h} score"><span>–</span><input class="sc${b}" type="number" min="0" inputmode="numeric" data-k="${k}" value="${s[1]??''}" ${ro?'disabled':''} aria-label="${a} score"><span>${a}</span></div>`}).join('')}</div></div>`}).join('')+'</div>'}
function matchHTML(m,sd,ro,neutral){return`<div class="m"><div class="note">${m.t}${neutral?', neutral court':''}</div>`+[['h',m.h],['a',m.a]].map(([k,t])=>{const x=num(m.hs),y=num(m.as),b=x!==null&&x===y?' bad':'';
 return`<div class="r${m.win&&m.win===t?' w':''}"><span class="seed">${t&&sd?sd.indexOf(t)+1:''}</span><span style="flex:1">${t?tm(t):'<span class="note">To be decided</span>'}</span><input class="sc${b}" type="number" min="0" inputmode="numeric" data-ko="${m.id}" data-s="${k}" value="${m[k+'s']}" ${ro||!(m.h&&m.a)?'disabled':''} aria-label="${t||'TBD'} score"></div>`}).join('')+'</div>'}
function bracketHTML(st,ro){const{m,s}=bracket(st);
 const conf=(c,n)=>`<h2>${n}</h2>${s[c]?'':`<p class="note">Seeds appear once all 30 ${n} group games have scores (${[0,1,2].reduce((t,i)=>t+stand(st,i+(c==='W'?3:0)).n,0)} entered).</p>`}<div class="scroll"><div class="br"><div class="col">${matchHTML(m[c+'Q1'],s[c],ro)}${matchHTML(m[c+'Q2'],s[c],ro)}</div>${matchHTML(m[c+'S'],s[c],ro)}</div></div>`;
 return conf('E','East')+conf('W','West')+`<h2>Final</h2>${matchHTML(m.F,null,ro,1)}`}
function render(){
 let h=`<div class="wrap"><div class="top"><div><h1>NBA Cup</h1><div class="note">Draw the groups, log scores, run the bracket and keep every Cup.</div></div><div class="bar"><label class="note">Season <input id="season" value="${e(S.season)}" size="8"></label>${btn('reset','Reset Cup')}${btn('wipe','Delete everything','d')}</div></div>`;
 if(!ok)h+=`<p class="note" style="color:var(--bad)">This browser is blocking storage, so nothing will be kept after you close the page. Use the backup box in History.</p>`;
 h+=`<div class="tabs" role="tablist">${[['groups','Groups'],['bracket','Bracket'],['history','History ('+S.history.length+')']].map(([k,l])=>`<button role="tab" data-act="tab:${k}" aria-selected="${tab===k}">${l}</button>`).join('')}</div>`;
 if(tab==='groups'){
  if(!S.groups)h+=`<div class="card empty"><h3>No groups yet for ${e(S.season)}</h3><p class="note">Draw three random groups of five in each conference, like the real Cup.</p>${btn('draw','Draw groups','p')}</div>`;
  else{const n=[0,1,2,3,4,5].reduce((t,i)=>t+stand(S,i).n,0);
   h+=`<div class="bar" style="margin-bottom:12px">${btn('draw','Redraw groups')}<button data-act="import" class="p">Import BBGM games</button><input type="file" id="bbf" accept=".json,application/json" hidden><span class="note">${n} of 60 group games entered. Ties break on point difference, then points scored. Scores save as you type.</span></div>`+(imsg?`<p class="note">${e(imsg)}</p>`:'')+groupsHTML(S,false)}}
 if(tab==='bracket'){
  if(!S.groups)h+=`<div class="card empty"><h3>Draw the groups first</h3><p class="note">The bracket fills in after the group games are scored.</p>${btn('tab:groups','Go to groups','p')}</div>`;
  else{const F=bracket(S).m.F;
   if(F.win)h+=`<div class="card" style="margin-bottom:12px"><h3>Champion: ${tm(F.win)}</h3><p class="note">Next season saves this Cup to History and moves the tracker to ${e(nextSeason(S.season))}.</p>${btn('archive','Next season','p')}</div>`;
   h+=bracketHTML(S,false)}}
 if(tab==='history'){
  h+=S.history.length?S.history.map((x,i)=>`<div class="card" style="margin-bottom:12px"><details><summary>${e(x.season)}: ${tm(x.champ)} beat ${tm(x.run)}, ${x.score} <span class="note">(saved ${e(x.date)})</span></summary>${bracketHTML(x.snap,true)}<h2>Group stage</h2>${groupsHTML(x.snap,true)}</details>${btn('del:'+i,'Delete this entry','d')}</div>`).join(''):`<div class="card empty"><h3>No saved Cups yet</h3><p class="note">Finish a bracket and choose Next season.</p></div>`;
  h+=`<div class="card"><h3>Backup</h3><p class="note">Data lives in this browser only. Copy the backup text somewhere safe, or paste a saved backup and load it. ${e(msg)}</p><textarea id="bk" aria-label="Backup text"></textarea><div class="bar" style="margin-top:8px"><button data-act="bshow">Show backup</button><button data-act="bload">Load backup</button></div></div>`}
 $('#app').innerHTML=h+'</div>'}
const $=s=>document.querySelector(s);
function act(a){
 const need=a==='reset'||a==='wipe'||a.startsWith('del:')||(a==='draw'&&S.groups&&Object.values(S.games).some(g=>g.some(v=>v!=='')));
 if(need&&armed!==a){armed=a;clearTimeout(tmr);tmr=setTimeout(()=>{armed=null;render()},3500);render();return}
 armed=null;msg='';
 if(a.startsWith('tab:'))tab=a.slice(4);
 else if(a==='draw'){const[x,y]=[ch(sh(EA)),ch(sh(WE))];S.groups=[...x,...y];S.games={};S.ko={};tab='groups'}
 else if(a==='reset'){S.groups=null;S.games={};S.ko={}}
 else if(a==='wipe')S=fresh();
 else if(a==='archive'){const F=bracket(S).m.F;if(!F.win)return;S.history.unshift({id:Date.now(),season:S.season,date:new Date().toLocaleDateString(),champ:F.win,run:F.win===F.h?F.a:F.h,score:F.hs+'–'+F.as,snap:{groups:S.groups,games:S.games,ko:S.ko}});S.season=nextSeason(S.season);S.groups=null;S.games={};S.ko={};tab='groups'}
 else if(a.startsWith('del:'))S.history.splice(+a.slice(4),1);
 else if(a==='bload'){try{const j=JSON.parse($('#bk').value);if(!j||!Array.isArray(j.history))throw 0;S=Object.assign(fresh(),j);msg='Backup loaded.'}catch(x){msg='That text is not a valid backup.'}}
 save();render();
 if(a==='bshow'){$('#bk').value=JSON.stringify(S)}}
async function importBBGM(f){
 try{
  if(!S.groups){imsg='Draw the groups first, then import.';return}
  const j=JSON.parse(await f.text());
  if(!j||!Array.isArray(j.teams)||!Array.isArray(j.games)||!j.games.length){imsg='No game results found in that file. When exporting from BBGM, tick the game results option.';return}
  const ab={};j.teams.forEach(t=>{ab[t.tid]=T[t.abbrev]?t.abbrev:Object.keys(T).find(k=>T[k][0]===t.name)||t.abbrev});
  const num2=v=>typeof v==='number'&&isFinite(v)&&v>=0;
  /* Only real regular-season games count. Playoffs and anything flagged as exhibition are ignored,
     so exhibition knockout games can never leak into the group stage. */
  const rg=j.games.filter(g=>!g.playoffs&&!g.exhibition&&Array.isArray(g.teams)&&g.teams.length===2&&g.teams.every(t=>num2(t.pts)));
  if(!rg.length){imsg='That export has no regular-season games yet.';return}
  const ss=rg.reduce((m,g)=>Math.max(m,g.season||0),0);
  const gm=rg.filter(g=>(g.season||0)===ss).sort((a,b)=>(a.day??a.gid)-(b.day??b.gid)||a.gid-b.gid);
  const gi={},K={};S.groups.forEach((g,i)=>{g.forEach(t=>gi[t]=i);pairs(g).forEach(([h,a])=>K[h+'>'+a]=1)});
  const seen={},miss=new Set();let filled=0,kept=0,met=0;
  gm.forEach(g=>{const[x,y]=g.teams,a=ab[x.tid],b=ab[y.tid];
   if(!T[a]||!T[b]){[a,b].forEach(t=>{if(!T[t])miss.add(t)});return}
   if(gi[a]!==gi[b])return;
   const p=[a,b].sort().join('|');if(seen[p])return;seen[p]=1;met++;
   const fwd=!!K[a+'>'+b],k=fwd?a+'>'+b:b+'>'+a,sc=fwd?[x.pts,y.pts]:[y.pts,x.pts],cur=S.games[k];
   if(cur&&cur[0]!==''&&cur[1]!==''&&cur[0]!=null&&cur[1]!=null){kept++;return}
   S.games[k]=sc;filled++});
  imsg=`Imported ${filled} new group game${filled===1?'':'s'} from the ${ss} regular season (first meeting of each pair only).`+(kept?` ${kept} already had scores and were left alone.`:'')+(met<60?` ${60-met} pairs haven't met yet, so export again later and re-import.`:'')+' Playoff and exhibition games are ignored, and knockout scores are never touched.'+(miss.size?` Unrecognised team abbreviations: ${[...miss].join(', ')}.`:'')
 }catch(x){imsg='That file could not be read as a BBGM export.'}
 finally{save();render()}}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;if(b.dataset.act==='import'){$('#bbf').click();return}act(b.dataset.act)});
document.addEventListener('change',ev=>{const t=ev.target;
 if(t.id==='season'){S.season=t.value||'Cup';save();return}
 if(t.id==='bbf'){if(t.files[0])importBBGM(t.files[0]);t.value='';return}
 if(!t.matches('input.sc'))return;
 if(t.dataset.ko){const id=t.dataset.ko,m=bracket(S).m[id],v=[...document.querySelectorAll(`[data-ko="${id}"]`)].map(i=>i.value);S.ko[id]={h:m.h,a:m.a,hs:v[0],as:v[1]}}
 else{S.games[t.dataset.k]=[...document.querySelectorAll(`[data-k="${CSS.escape(t.dataset.k)}"]`)].map(i=>i.value)}
 save();render()});
render();
</script></body></html>
